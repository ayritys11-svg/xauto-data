name: Rajapintakoe
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Yhden ilmoituksen kenttärakenne (1 haku)
        env:
          AUTODEV_KEY: ${{ secrets.AUTODEV_KEY }}
        run: |
          curl -s -H "Authorization: Bearer $AUTODEV_KEY" "https://api.auto.dev/listings/1G1Y72D47L5117310" > l.json
          node -e '
          const j=JSON.parse(require("fs").readFileSync("l.json","utf8"));
          const walk=(o,p)=>{ if(Array.isArray(o)){ console.log(p+"[] ("+o.length+")"); if(o.length) walk(o[0],p+"[0]"); return;} if(o&&typeof o==="object"){ for(const k of Object.keys(o)) walk(o[k],p?p+"."+k:k); return;} console.log(p+" = "+JSON.stringify(o).slice(0,120)); };
          walk(j,"");'
