name: Diagnostiikka
on:
  push:
    branches: [main]
    paths: ["diag/*.mjs"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: for f in diag/*.mjs; do node "$f" || true; done
      - run: |
          git config user.name "xauto-bot"; git config user.email "xauto-bot@users.noreply.github.com"
          git add diag/*.json; git diff --cached --quiet || git commit -m "Diagnostiikka $(date -u +%F)"
          git pull --rebase -q origin main || true; git push
