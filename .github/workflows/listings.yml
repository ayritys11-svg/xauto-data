name: Autoilmoitukset
on:
  schedule:
    - cron: "17 2 * * *"   # joka yö klo 4.17 Suomen aikaa
  workflow_dispatch: {}      # käsin: Actions -> Autoilmoitukset -> Run workflow
  push:                      # ajetaan myös kun hakuja, kuluja tai laskentaa muutetaan
    branches: [main]
    paths: ["config/**", "scripts/**", "calc.js", "data/autovero_core.json", "listings.js", "listings.css"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hae ja laske ilmoitukset
        env:
          AUTODEV_KEY: ${{ secrets.AUTODEV_KEY }}
        run: node scripts/fetch-listings.mjs
      - name: Kuvatarkistus
        run: node scripts/imgcheck.mjs || true
      - name: Tallenna
        run: |
          git config user.name "xauto-bot"
          git config user.email "xauto-bot@users.noreply.github.com"
          git add data/listings.json data/imgcheck.json
          git diff --cached --quiet || git commit -m "Ilmoitukset päivitetty $(date -u +%F)"
          git pull --rebase -q origin main || true
          git push
      - name: Tyhjennä jsDelivr-välimuisti
        run: |
          for f in data/listings.json listings.js listings.css; do curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f" > /dev/null || true; done
