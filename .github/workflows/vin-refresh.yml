name: VIN-tiedot ja varusteet
on:
  workflow_dispatch: {}   # käsin: hakee VIN-tiedot (NHTSA, ilmainen) ja laskee ilmoitukset uudelleen ilman auto.dev-hakuja
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: VIN-dekoodaus ja uudelleenlaskenta
        run: node scripts/fetch-listings.mjs --recompute
      - name: Tallenna
        run: |
          git config user.name "xauto-bot"
          git config user.email "xauto-bot@users.noreply.github.com"
          git add -A data/listings.json data/vin_cache.json data/x
          git diff --cached --quiet || git commit -m "VIN-tiedot ja varusteet päivitetty $(date -u +%F) [skip ci]"
          git pull --rebase -q origin main || true
          git push
      - name: Tyhjennä jsDelivr-välimuisti
        run: curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/data/listings.json" > /dev/null || true
