name: Mallikartoitus
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["config/discover.json"]
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kartoita mallit
        env:
          AUTODEV_KEY: ${{ secrets.AUTODEV_KEY }}
        run: node scripts/fetch-listings.mjs --discover
      - name: Tallenna
        run: |
          git config user.name "xauto-bot"
          git config user.email "xauto-bot@users.noreply.github.com"
          git add data/discover.json
          git diff --cached --quiet || git commit -m "Mallikartoitus $(date -u +%F)"
          git pull --rebase -q origin main || true
          git push
